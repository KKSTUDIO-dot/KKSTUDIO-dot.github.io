<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Профиль пользователя</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui;
            background: #0b0e14;
            color: #eef2ff;
            padding-bottom: 80px;
        }
        .profile-container {
            max-width: 700px;
            margin: 20px auto;
            padding: 0 16px;
        }
        .profile-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            background: #2d3748;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            overflow: hidden;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-name {
            font-size: 24px;
            font-weight: 600;
        }
        .profile-username {
            color: #9ca3b5;
            margin: 4px 0 12px;
        }
        .follow-btn {
            background: #3b82f6;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .follow-btn.following {
            background: #4a5568;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #141821;
            padding: 16px;
            border-radius: 28px;
            margin-bottom: 28px;
        }
        .stats div {
            text-align: center;
        }
        .stats span {
            display: block;
            font-size: 22px;
            font-weight: bold;
        }
        .stats label {
            font-size: 13px;
            color: #9ca3b5;
        }
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
        .grid-post {
            aspect-ratio: 1 / 1;
            background: #141821;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .grid-post img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .grid-post i {
            font-size: 32px;
            color: #4a5568;
        }
        .no-image {
            text-align: center;
            padding: 12px;
            font-size: 12px;
            color: #9ca3b5;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(18,22,32,0.96);
            backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 8px 20px 14px;
            z-index: 1000;
        }
        .nav-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            max-width: 580px;
            margin: 0 auto;
        }
        .nav-item {
            flex: 1;
            background: none;
            border: none;
            color: #9ca3b5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 28px;
        }
        .nav-item.active {
            color: #3b82f6;
        }
        .icon-photo {
            font-size: 26px;
        }
        .nav-plus {
            margin: 0 4px;
            position: relative;
            top: -10px;
        }
        .plus-button {
            background: linear-gradient(135deg,#3b82f6,#8b5cf6);
            width: 58px;
            height: 58px;
            border-radius: 36px;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(59,130,246,0.4);
        }
        @media (max-width:480px) {
            .icon-photo { font-size: 24px; }
            .plus-button { width: 52px; height: 52px; font-size: 24px; }
        }
    </style>
</head>
<body>
<div class="profile-container" id="profileContainer"></div>
<div class="bottom-nav">
    <div class="nav-container">
        <button class="nav-item" data-page="feed"><div class="icon-photo"><i class="fas fa-newspaper"></i></div><span>Лента</span></button>
        <div class="nav-plus"><button class="plus-button" id="plusBtn"><i class="fas fa-plus"></i></button></div>
        <button class="nav-item" data-page="chats"><div class="icon-photo"><i class="fas fa-comments"></i></div><span>Чаты</span></button>
        <button class="nav-item" data-page="profile"><div class="icon-photo"><i class="fas fa-user-circle"></i></div><span>Профиль</span></button>
    </div>
</div>
<script>
    (function() {
        const SUPABASE_URL = 'https://dkzhqfdfjzovzephxaxe.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRremhxZmRmanpvdnplcGh4YXhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NTQ4OTAsImV4cCI6MjA5NTUzMDg5MH0.dmLLQe9QF1hlshT_DtbdQe4Z0h-bLGTRv3TFwJgtpk8';

        if (!window._supabaseClient) window._supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const supabase = window._supabaseClient;

        let currentUser = null;
        let targetUserId = null;
        let targetProfile = null;
        let isFollowing = false;

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            targetUserId = urlParams.get('id');
            if (!targetUserId) {
                alert('Не указан пользователь');
                window.location.href = 'index.html';
                return;
            }
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            await loadTargetProfile();
            await checkFollowStatus();
            renderProfile();
            renderUserPosts();
        }

        async function loadTargetProfile() {
            const { data, error } = await supabase.from('profiles').select('*').eq('id', targetUserId).single();
            if (error) console.error(error);
            targetProfile = data;
        }

        async function checkFollowStatus() {
            if (!currentUser || !targetUserId) return;
            const { data, error } = await supabase
                .from('follows')
                .select('id')
                .eq('follower_id', currentUser.id)
                .eq('following_id', targetUserId)
                .maybeSingle();
            if (error) console.error(error);
            isFollowing = !!data;
        }

        async function toggleFollow() {
            if (!currentUser) return;
            if (isFollowing) {
                const { error } = await supabase
                    .from('follows')
                    .delete()
                    .eq('follower_id', currentUser.id)
                    .eq('following_id', targetUserId);
                if (!error) isFollowing = false;
                else alert('Ошибка при отписке');
            } else {
                const { error } = await supabase
                    .from('follows')
                    .insert({ follower_id: currentUser.id, following_id: targetUserId });
                if (!error) isFollowing = true;
                else alert('Ошибка при подписке');
            }
            renderProfile(); // обновить кнопку
        }

        function renderProfile() {
            if (!targetProfile) return;
            const avatarHtml = targetProfile.avatar ? `<img src="${targetProfile.avatar}">` : '<i class="fas fa-user-circle"></i>';
            const followButtonText = isFollowing ? 'Отписаться' : 'Подписаться';
            const followButtonClass = isFollowing ? 'follow-btn following' : 'follow-btn';
            const statsHtml = `
                <div class="stats">
                    <div><span id="postsCount">0</span><label>публикаций</label></div>
                    <div><span>${targetProfile.followers || 0}</span><label>подписчиков</label></div>
                    <div><span>${targetProfile.following || 0}</span><label>подписок</label></div>
                </div>
            `;
            const fullHtml = `
                <div class="profile-header">
                    <div class="avatar">${avatarHtml}</div>
                    <div class="profile-name">${escapeHtml(targetProfile.username || 'Пользователь')}</div>
                    <div class="profile-username">@${escapeHtml(targetProfile.username || 'user')}</div>
                    <button class="${followButtonClass}" id="followBtn">${followButtonText}</button>
                </div>
                ${statsHtml}
                <h3 style="margin: 16px 0 8px;">Публикации</h3>
                <div id="userPostsGrid" class="posts-grid"></div>
            `;
            document.getElementById('profileContainer').innerHTML = fullHtml;
            document.getElementById('followBtn')?.addEventListener('click', toggleFollow);
        }

        async function renderUserPosts() {
            const { data: posts, error } = await supabase
                .from('posts')
                .select('*')
                .eq('user_id', targetUserId)
                .eq('type', 'feed')
                .order('created_at', { ascending: false });
            if (error) return;
            document.getElementById('postsCount').innerText = posts.length;
            const grid = document.getElementById('userPostsGrid');
            if (!posts.length) {
                grid.innerHTML = '<div style="grid-column:span 3; text-align:center;padding:40px;">Нет публикаций</div>';
                return;
            }
            let html = '';
            for (const post of posts) {
                if (post.image) {
                    html += `<div class="grid-post"><img src="${post.image}" alt="post"></div>`;
                } else {
                    html += `<div class="grid-post"><div class="no-image"><i class="fas fa-file-alt"></i><br>${escapeHtml(post.content.substring(0, 20))}...</div></div>`;
                }
            }
            grid.innerHTML = html;
        }

        function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]) || ''; }

        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const page = btn.dataset.page;
                if (page === 'feed') window.location.href = 'index.html';
                else if (page === 'chats') window.location.href = 'index.html';
                else if (page === 'profile') window.location.href = 'profile.html';
            });
        });
        document.getElementById('plusBtn')?.addEventListener('click', () => window.location.href = 'post.html');

        init();
    })();
</script>
</body>
</html>
