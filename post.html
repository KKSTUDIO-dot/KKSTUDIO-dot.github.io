<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Новый пост</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui;
            background: #0b0e14;
            color: #eef2ff;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .post-container {
            max-width: 500px;
            width: 100%;
            background: #141821;
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
        }
        .post-container h2 {
            margin-bottom: 24px;
            text-align: center;
        }
        textarea {
            width: 100%;
            background: #0f131c;
            border: 1px solid #2d3748;
            border-radius: 24px;
            padding: 14px;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            resize: vertical;
        }
        .file-label {
            display: block;
            background: #2d3748;
            padding: 12px;
            text-align: center;
            border-radius: 40px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .file-label:hover {
            background: #3a4a62;
        }
        #imagePreview {
            max-width: 100%;
            max-height: 200px;
            margin-bottom: 20px;
            border-radius: 20px;
            display: none;
        }
        .buttons {
            display: flex;
            gap: 12px;
        }
        button {
            flex: 1;
            background: #3b82f6;
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .cancel-btn {
            background: #4a5568;
        }
    </style>
</head>
<body>
<div class="post-container">
    <h2><i class="fas fa-plus-circle"></i> Создать пост</h2>
    <textarea id="postDesc" rows="4" placeholder="Поделитесь новостью..."></textarea>
    <label class="file-label"><i class="fas fa-image"></i> Выбрать фото <input type="file" id="postImage" accept="image/*" style="display: none;"></label>
    <img id="imagePreview" alt="Предпросмотр">
    <div class="buttons">
        <button id="publishBtn">Опубликовать</button>
        <button id="cancelBtn" class="cancel-btn">Отмена</button>
    </div>
</div>

<script>
    (function() {
        const SUPABASE_URL = 'https://dkzhqfdfjzovzephxaxe.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRremhxZmRmanpvdnplcGh4YXhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NTQ4OTAsImV4cCI6MjA5NTUzMDg5MH0.dmLLQe9QF1hlshT_DtbdQe4Z0h-bLGTRv3TFwJgtpk8';

        if (!window._supabaseClient) window._supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const supabase = window._supabaseClient;

        const imageInput = document.getElementById('postImage');
        const preview = document.getElementById('imagePreview');
        let imageData = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    imageData = ev.target.result;
                    preview.src = imageData;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                imageData = null;
                preview.style.display = 'none';
            }
        });

        document.getElementById('publishBtn').addEventListener('click', async () => {
            const content = document.getElementById('postDesc').value.trim();
            if (!content) {
                alert('Напишите текст поста');
                return;
            }

            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                alert('Вы не авторизованы. Переход на главную.');
                window.location.href = 'index.html';
                return;
            }

            const newPost = {
                user_id: user.id,
                content: content,
                image: imageData || null,
                type: 'feed',   // Всегда "Лента"
                likes: 0
            };
            const { error } = await supabase.from('posts').insert([newPost]);
            if (error) alert('Ошибка: ' + error.message);
            else window.location.href = 'index.html';
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    })();
</script>
</body>
</html>
