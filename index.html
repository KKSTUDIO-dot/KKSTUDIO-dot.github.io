<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Соцсеть – Лента</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #0b0e14;
            color: #eef2ff;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #0b0e14 0%, #141a24 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .splash-content {
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }
        .splash-title {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c0d4ff, #8aabff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .splash-sub {
            font-size: 1.4rem;
            font-weight: 500;
            color: #9ca3b5;
            margin-bottom: 32px;
            font-style: italic;
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .splash-screen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .main-app {
            display: none;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 20px;
        }

        .post-card {
            background: #141821;
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid #232a36;
        }
        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .avatar {
            width: 44px;
            height: 44px;
            background: #2d3748;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            overflow: hidden;
            cursor: pointer;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .post-author {
            cursor: pointer;
            font-weight: 600;
        }
        .post-author:hover {
            text-decoration: underline;
        }
        .post-image {
            max-width: 100%;
            border-radius: 20px;
            margin: 10px 0;
        }
        .post-stats {
            margin-top: 10px;
            color: #9ca3b5;
            font-size: 13px;
        }

        .bottom-nav {
            position: sticky;
            bottom: 0;
            width: 100%;
            background: rgba(18, 22, 32, 0.96);
            backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 20px 14px;
            z-index: 100;
        }
        .nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            max-width: 500px;
            margin: 0 auto;
        }
        .nav-item {
            flex: 1;
            background: none;
            border: none;
            color: #9ca3b5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 28px;
            transition: 0.2s;
        }
        .nav-item.active {
            color: #3b82f6;
        }
        .icon-photo {
            font-size: 26px;
        }
        .nav-plus {
            flex: 0 0 auto;
            margin: 0 8px;
            position: relative;
            top: -10px;
        }
        .plus-button {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            width: 58px;
            height: 58px;
            border-radius: 36px;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }
        .plus-button:active {
            transform: scale(0.92);
        }

        .auth-card {
            background: #141821;
            border-radius: 28px;
            padding: 24px;
            max-width: 400px;
            margin: 40px auto;
        }
        .auth-card input {
            width: 100%;
            background: #0f131c;
            border: 1px solid #2d3748;
            border-radius: 40px;
            padding: 12px 16px;
            margin: 10px 0;
            color: white;
            font-size: 16px;
        }
        .auth-card button {
            background: #3b82f6;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.4);
            transform: scale(0);
            animation: ripple 0.5s linear;
            pointer-events: none;
        }
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        @media (max-width: 480px) {
            .icon-photo { font-size: 24px; }
            .plus-button { width: 52px; height: 52px; font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="splash-screen" id="splash">
    <div class="splash-content">
        <div class="splash-title">Лента</div>
        <div class="splash-sub">свежие новости</div>
        <div class="loader"></div>
    </div>
</div>

<div class="main-app" id="mainApp">
    <div class="main-content" id="mainContent"></div>
    <div class="bottom-nav">
        <div class="nav-container">
            <button class="nav-item active" data-tab="feed"><div class="icon-photo"><i class="fas fa-newspaper"></i></div><span>Лента</span></button>
            <div class="nav-plus"><button class="plus-button" id="createPostBtn"><i class="fas fa-plus"></i></button></div>
            <button class="nav-item" data-tab="chats"><div class="icon-photo"><i class="fas fa-comments"></i></div><span>Чаты</span></button>
            <button class="nav-item" data-tab="profile"><div class="icon-photo"><i class="fas fa-user-circle"></i></div><span>Профиль</span></button>
        </div>
    </div>
</div>

<script>
    (function() {
        const SUPABASE_URL = 'https://dkzhqfdfjzovzephxaxe.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRremhxZmRmanpvdnplcGh4YXhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NTQ4OTAsImV4cCI6MjA5NTUzMDg5MH0.dmLLQe9QF1hlshT_DtbdQe4Z0h-bLGTRv3TFwJgtpk8';

        if (!window._supabaseClient) window._supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const supabase = window._supabaseClient;

        let currentUser = null;
        let currentTab = 'feed';

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                if (splash) splash.classList.add('hide');
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.getElementById('mainApp').style.display = 'flex';
                    checkUser();
                }, 800);
            }, 2000);
        });

        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                currentUser = user;
                renderCurrentTab();
            } else {
                showAuth();
            }
        }

        function showAuth() {
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="auth-card">
                    <h2>Вход / Регистрация</h2>
                    <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
                    <input type="password" id="authPassword" placeholder="Пароль (минимум 6 символов)">
                    <button id="loginBtn">Войти</button>
                    <button id="registerBtn" style="background:#4a5568">Зарегистрироваться</button>
                </div>
            `;
            document.getElementById('loginBtn').onclick = async () => {
                const email = document.getElementById('authEmail').value;
                const password = document.getElementById('authPassword').value;
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
                else location.reload();
            };
            document.getElementById('registerBtn').onclick = async () => {
                const email = document.getElementById('authEmail').value;
                const password = document.getElementById('authPassword').value;
                const { error } = await supabase.auth.signUp({ email, password });
                if (error) alert(error.message);
                else alert('Регистрация успешна! Проверьте почту для подтверждения (если требуется).');
            };
        }

        async function renderPosts() {
            const { data: posts, error } = await supabase
                .from('posts')
                .select('*, profiles(id, username, avatar)')
                .eq('type', 'feed')
                .order('created_at', { ascending: false });
            if (error) return '<p>Ошибка загрузки постов</p>';
            if (!posts.length) return '<div style="text-align:center;padding:40px;">Нет постов. Нажмите + чтобы создать</div>';
            return posts.map(post => `
                <div class="post-card">
                    <div class="post-header">
                        <div class="avatar" data-user-id="${post.profiles.id}">${post.profiles?.avatar ? `<img src="${post.profiles.avatar}">` : '<i class="fas fa-user-circle"></i>'}</div>
                        <div><span class="post-author" data-user-id="${post.profiles.id}">${escapeHtml(post.profiles?.username || 'Пользователь')}</span><br><small>${new Date(post.created_at).toLocaleString()}</small></div>
                    </div>
                    <div class="post-content">${escapeHtml(post.content)}</div>
                    ${post.image ? `<img src="${post.image}" class="post-image">` : ''}
                    <div class="post-stats"><i class="fas fa-heart"></i> ${post.likes}</div>
                </div>
            `).join('');
        }

        function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]) || ''; }

        async function renderCurrentTab() {
            const container = document.getElementById('mainContent');
            if (!currentUser) return;
            if (currentTab === 'feed') {
                container.innerHTML = `<h2><i class="fas fa-newspaper"></i> Лента</h2><div id="postsContainer">${await renderPosts()}</div>`;
                document.querySelectorAll('.avatar, .post-author').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const userId = el.dataset.userId;
                        if (userId && userId !== currentUser.id) {
                            window.location.href = `user_profile.html?id=${userId}`;
                        } else if (userId === currentUser.id) {
                            window.location.href = 'profile.html';
                        }
                    });
                });
            } else if (currentTab === 'chats') {
                container.innerHTML = `<div style="text-align:center;padding:40px;"><i class="fas fa-comments" style="font-size:48px"></i><p>Чаты будут позже</p></div>`;
            } else if (currentTab === 'profile') {
                window.location.href = 'profile.html';
            }
        }

        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tab = btn.dataset.tab;
                if (tab === 'profile') { window.location.href = 'profile.html'; return; }
                if (tab) {
                    currentTab = tab;
                    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderCurrentTab();
                    createRipple(e, btn);
                }
            });
        });

        document.getElementById('createPostBtn').addEventListener('click', () => {
            window.location.href = 'post.html';
        });

        function createRipple(event, element) {
            const rect = element.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size/2;
            const y = event.clientY - rect.top - size/2;
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            element.style.position = 'relative';
            element.style.overflow = 'hidden';
            element.appendChild(ripple);
            setTimeout(() => ripple.remove(), 500);
        }
    })();
</script>
</body>
</html>
