<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui;
            background: #0b0e14;
            color: #eef2ff;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .login-card {
            max-width: 400px;
            margin: 100px auto;
            background: #141821;
            padding: 32px;
            border-radius: 32px;
            text-align: center;
        }
        .login-card input {
            width: 100%;
            padding: 12px 16px;
            background: #0f131c;
            border: 1px solid #2d3748;
            border-radius: 40px;
            color: white;
            margin: 16px 0;
        }
        .login-card button {
            background: #3b82f6;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #141821;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
        }
        .stat-card i {
            font-size: 32px;
            margin-bottom: 8px;
            color: #3b82f6;
        }
        .stat-card h3 {
            font-size: 28px;
        }
        .section {
            background: #141821;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 32px;
        }
        .section h2 {
            margin-bottom: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #2d3748;
        }
        th {
            color: #9ca3b5;
            font-weight: 500;
        }
        .badge {
            background: #3b82f6;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
        }
        button.small-btn {
            background: #4a5568;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            margin-right: 6px;
        }
        button.danger {
            background: #ef4444;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2d3748;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            th, td { font-size: 12px; padding: 8px; }
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    (function() {
        // Конфиг Supabase (ваши данные)
        const SUPABASE_URL = 'https://dkzhqfdfjzovzephxaxe.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRremhxZmRmanpvdnplcGh4YXhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NTQ4OTAsImV4cCI6MjA5NTUzMDg5MH0.dmLLQe9QF1hlshT_DtbdQe4Z0h-bLGTRv3TFwJgtpk8';
        
        let supabase;
        let currentUser = null;
        let isAdmin = false;

        // Простая авторизация админа (по паролю)
        // Если хотите использовать роль из БД, закомментируйте этот блок
        const ADMIN_PASSWORD = 'admin123'; // смените на свой

        async function init() {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            // Проверяем авторизацию в Supabase (если пользователь залогинен, получим его)
            const { data: { user } } = await supabase.auth.getUser();
            currentUser = user;
            
            // Проверяем админские права (сначала через пароль, потом через role)
            // Для простоты показываем форму ввода пароля
            const storedAuth = sessionStorage.getItem('admin_auth');
            if (storedAuth === 'true') {
                isAdmin = true;
                loadAdminPanel();
            } else {
                showLoginForm();
            }
        }

        function showLoginForm() {
            document.getElementById('app').innerHTML = `
                <div class="login-card">
                    <i class="fas fa-shield-alt" style="font-size: 48px; margin-bottom: 16px; color: #3b82f6;"></i>
                    <h2>Вход в админ-панель</h2>
                    <input type="password" id="adminPassword" placeholder="Пароль администратора">
                    <button id="loginAdminBtn">Войти</button>
                </div>
            `;
            document.getElementById('loginAdminBtn').onclick = () => {
                const pwd = document.getElementById('adminPassword').value;
                if (pwd === ADMIN_PASSWORD) {
                    sessionStorage.setItem('admin_auth', 'true');
                    isAdmin = true;
                    loadAdminPanel();
                } else {
                    alert('Неверный пароль');
                }
            };
        }

        async function loadAdminPanel() {
            const app = document.getElementById('app');
            app.innerHTML = `<div class="container"><div class="loading"><div class="spinner"></div><p>Загрузка данных...</p></div></div>`;
            
            // Получаем данные из БД
            const [users, posts, profiles] = await Promise.all([
                supabase.from('profiles').select('*').order('created_at', { ascending: false }),
                supabase.from('posts').select('*, profiles(username)').order('created_at', { ascending: false }),
                supabase.from('profiles').select('*')
            ]);
            
            const usersData = users.data || [];
            const postsData = posts.data || [];
            
            const stats = {
                users: usersData.length,
                posts: postsData.length,
                feedPosts: postsData.filter(p => p.type === 'feed').length,
                entityPosts: postsData.filter(p => p.type === 'entity').length,
                totalLikes: postsData.reduce((sum, p) => sum + (p.likes || 0), 0)
            };
            
            const html = `
                <div class="container">
                    <h1><i class="fas fa-user-shield"></i> Админ-панель</h1>
                    
                    <div class="stats-grid">
                        <div class="stat-card"><i class="fas fa-users"></i><h3>${stats.users}</h3><p>Пользователей</p></div>
                        <div class="stat-card"><i class="fas fa-newspaper"></i><h3>${stats.posts}</h3><p>Всего постов</p></div>
                        <div class="stat-card"><i class="fas fa-heart"></i><h3>${stats.totalLikes}</h3><p>Лайков</p></div>
                        <div class="stat-card"><i class="fas fa-shapes"></i><h3>${stats.entityPosts}</h3><p>Постов в Сущности</p></div>
                    </div>
                    
                    <div class="section">
                        <h2><i class="fas fa-users"></i> Пользователи (${usersData.length})</h2>
                        <div style="overflow-x: auto;">
                            <table>
                                <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Подписчики</th><th>Подписки</th><th>Действия</th></tr></thead>
                                <tbody>
                                    ${usersData.map(u => `
                                        <tr>
                                            <td>${u.id.substring(0,8)}...</td>
                                            <td>${escapeHtml(u.username || '—')}</td>
                                            <td>—</td>
                                            <td>${u.followers || 0}</td>
                                            <td>${u.following || 0}</td>
                                            <td><button class="small-btn danger" onclick="window.deleteUser('${u.id}')">Удалить</button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div class="section">
                        <h2><i class="fas fa-feather-alt"></i> Все посты (${postsData.length})</h2>
                        <div style="overflow-x: auto;">
                            <table>
                                <thead><tr><th>ID</th><th>Автор</th><th>Тип</th><th>Текст</th><th>Лайки</th><th>Дата</th><th>Действия</th></tr></thead>
                                <tbody>
                                    ${postsData.map(p => `
                                        <tr>
                                            <td>${p.id}</td>
                                            <td>${escapeHtml(p.profiles?.username || 'anon')}</td>
                                            <td><span class="badge">${p.type === 'feed' ? 'Лента' : 'Сущность'}</span></td>
                                            <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(p.content?.substring(0, 60))}${p.content?.length > 60 ? '…' : ''}</td>
                                            <td>${p.likes || 0}</td>
                                            <td>${new Date(p.created_at).toLocaleDateString()}</td>
                                            <td><button class="small-btn danger" onclick="window.deletePost('${p.id}')">Удалить</button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div style="text-align: center; margin-top: 20px;">
                        <button id="logoutAdminBtn" style="background: #4a5568; padding: 10px 20px; border: none; border-radius: 40px; cursor: pointer;">Выйти</button>
                    </div>
                </div>
            `;
            app.innerHTML = html;
            
            // Глобальные функции для удаления
            window.deletePost = async (postId) => {
                if (!confirm('Удалить этот пост?')) return;
                const { error } = await supabase.from('posts').delete().eq('id', postId);
                if (error) alert('Ошибка: ' + error.message);
                else loadAdminPanel();
            };
            
            window.deleteUser = async (userId) => {
                if (!confirm('Удалить пользователя? Все его посты также будут удалены (ON DELETE CASCADE).')) return;
                const { error } = await supabase.from('profiles').delete().eq('id', userId);
                if (error) alert('Ошибка: ' + error.message);
                else loadAdminPanel();
            };
            
            document.getElementById('logoutAdminBtn').onclick = () => {
                sessionStorage.removeItem('admin_auth');
                isAdmin = false;
                showLoginForm();
            };
        }
        
        function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]) || ''; }
        
        init();
    })();
</script>
</body>
</html>
